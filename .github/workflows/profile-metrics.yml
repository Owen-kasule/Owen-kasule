name: Generate Live GitHub Metrics

on:
  push:
    branches:
      - main
  schedule:
    - cron: "30 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate full GitHub contribution history
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Owen-kasule
          filename: metrics.contributions.svg
          output_action: none
          template: classic
          base: ""
          config_timezone: Africa/Kampala
          config_theme: dark
          config_display: large
          plugin_calendar: yes
          plugin_calendar_limit: 0

      - name: Generate recent GitHub activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Owen-kasule
          filename: metrics.activity.svg
          output_action: none
          template: classic
          base: ""
          config_timezone: Africa/Kampala
          config_theme: dark
          config_display: large
          plugin_activity: yes
          plugin_activity_limit: 10
          plugin_activity_days: 0
          plugin_activity_load: 500
          plugin_activity_timestamps: yes
          plugin_activity_visibility: public
          plugin_activity_filter: push, issue, pr, ref/create, release, review

      - name: Publish live metrics
        run: |
          cp /metrics_renders/metrics.contributions.svg ./metrics.contributions.svg
          cp /metrics_renders/metrics.activity.svg ./metrics.activity.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.contributions.svg metrics.activity.svg

          if git diff --cached --quiet; then
            echo "Metrics are already current."
            exit 0
          fi

          git commit -m "chore: refresh live GitHub metrics [skip ci]"
          git push
