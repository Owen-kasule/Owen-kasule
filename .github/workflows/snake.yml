name: Generate Snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate and publish live blue contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          rm -rf snake-source snake-build snake-output

          git clone --depth 1 --branch main "https://github.com/${GITHUB_REPOSITORY}.git" snake-source
          mkdir -p snake-build

          OUTPUT_DIR="${GITHUB_WORKSPACE}/snake-build" \
            node snake-source/.github/scripts/generate-blue-snake.js

          git clone --branch output --single-branch "https://github.com/${GITHUB_REPOSITORY}.git" snake-output

          cp snake-build/github-contribution-grid-snake.svg snake-output/
          cp snake-build/github-contribution-grid-snake-dark.svg snake-output/

          cd snake-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg

          if git diff --cached --quiet; then
            echo "Contribution snake is already current."
            exit 0
          fi

          git commit -m "chore: refresh improved blue contribution snake"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin output
