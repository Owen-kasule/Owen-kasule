name: Generate Snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate live blue contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Owen-kasule
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#1D4ED8&color_dots=#06070C,#10162A,#1D4ED8,#3B82F6,#60A5FA
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#60A5FA&color_dots=#06070C,#10162A,#1D4ED8,#3B82F6,#60A5FA

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
