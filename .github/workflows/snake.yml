name: Generate Snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate live blue contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          npx --yes generate-snake-animation@3 \
            --github_user=Owen-kasule \
            --output='dist/github-contribution-grid-snake.svg?color_snake=#1D4ED8&color_dots=#06070C,#10162A,#1D4ED8,#3B82F6,#60A5FA' \
            --output='dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#60A5FA&color_dots=#06070C,#10162A,#1D4ED8,#3B82F6,#60A5FA'

      - name: Publish snake to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin output
          rm -rf /tmp/profile-output
          git worktree add -B output /tmp/profile-output origin/output
          cp dist/github-contribution-grid-snake.svg /tmp/profile-output/
          cp dist/github-contribution-grid-snake-dark.svg /tmp/profile-output/
          cd /tmp/profile-output
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution snake is already current."
            exit 0
          fi
          git commit -m "chore: refresh blue contribution snake"
          git push origin HEAD:output
