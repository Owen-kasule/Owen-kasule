name: Update README Activity

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Update recent public GitHub activity
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.payload.repository.default_branch;
            const startMarker = '<!--RECENT_ACTIVITY:start-->';
            const endMarker = '<!--RECENT_ACTIVITY:end-->';

            const clean = (value = '') => String(value)
              .replace(/\[/g, '(')
              .replace(/\]/g, ')')
              .replace(/\n/g, ' ')
              .trim();

            const { data: events } = await github.request(
              'GET /users/{username}/events/public',
              {
                username: owner,
                per_page: 100,
                headers: {
                  'X-GitHub-Api-Version': '2022-11-28'
                }
              }
            );

            const items = [];

            for (const event of events) {
              if (items.length >= 6) break;

              const repoName = event.repo?.name;
              if (!repoName) continue;
              const repoUrl = `https://github.com/${repoName}`;

              if (event.type === 'PullRequestEvent') {
                const pr = event.payload?.pull_request;
                const action = event.payload?.action;
                if (!pr || !['opened', 'closed', 'reopened'].includes(action)) continue;

                let label = action === 'opened' ? 'Opened' : action === 'reopened' ? 'Reopened' : 'Closed';
                let icon = action === 'opened' ? '🔀' : action === 'reopened' ? '♻️' : '✅';

                if (action === 'closed' && pr.merged) {
                  label = 'Merged';
                  icon = '🟣';
                }

                items.push(
                  `- ${icon} ${label} [PR #${pr.number}: ${clean(pr.title)}](${pr.html_url}) in [${repoName}](${repoUrl})`
                );
                continue;
              }

              if (event.type === 'IssuesEvent') {
                const issue = event.payload?.issue;
                const action = event.payload?.action;
                if (!issue || !['opened', 'closed', 'reopened'].includes(action)) continue;

                const label = action === 'opened' ? 'Opened' : action === 'reopened' ? 'Reopened' : 'Closed';
                const icon = action === 'closed' ? '✅' : action === 'reopened' ? '♻️' : '🟦';

                items.push(
                  `- ${icon} ${label} [Issue #${issue.number}: ${clean(issue.title)}](${issue.html_url}) in [${repoName}](${repoUrl})`
                );
              }
            }

            const activity = items.length
              ? items.join('\n')
              : '- No recent public pull request or issue activity found.';

            const { data: readme } = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'README.md',
              ref: branch
            });

            const current = Buffer.from(readme.content, 'base64').toString('utf8');
            const start = current.indexOf(startMarker);
            const end = current.indexOf(endMarker);

            if (start === -1 || end === -1 || end < start) {
              core.setFailed('README activity markers were not found.');
              return;
            }

            const before = current.slice(0, start + startMarker.length);
            const after = current.slice(end);
            const updated = `${before}\n${activity}\n${after}`;

            if (updated === current) {
              core.info('README activity is already current.');
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: 'README.md',
              branch,
              message: 'chore: refresh recent GitHub activity',
              content: Buffer.from(updated).toString('base64'),
              sha: readme.sha
            });

            core.info(`Updated README with ${items.length} recent activity item(s).`);
