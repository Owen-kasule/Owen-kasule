<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="310" viewBox="0 0 1060 310" role="img" aria-label="GitHub Contribution Activity">
  <style>
    .title{font:700 28px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#60A5FA}
    .h{font:700 20px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#F8FAFC}
    .small{font:500 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#A9B4C5}
    .num{font:800 30px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#F8FAFC}
  </style>
  <rect x="1" y="1" width="1058" height="308" rx="14" fill="#10162A" stroke="#1D4ED8" stroke-width="2"/>
  <text class="title" x="28" y="46">GitHub Contribution Activity</text>
  <rect x="28" y="82" width="316" height="150" rx="12" fill="#06070C" stroke="#2A3550"/><text class="num" x="186" y="140" text-anchor="middle">2,017</text><text class="h" x="186" y="176" text-anchor="middle">Total Contributions</text><text class="small" x="186" y="207" text-anchor="middle">Since Sep 20, 2022</text>
  <rect x="370" y="82" width="316" height="150" rx="12" fill="#06070C" stroke="#2A3550"/><text class="num" x="528" y="140" text-anchor="middle">7</text><text class="h" x="528" y="176" text-anchor="middle">Current Streak</text><text class="small" x="528" y="207" text-anchor="middle">Aug 23 to Aug 29</text>
  <rect x="712" y="82" width="316" height="150" rx="12" fill="#06070C" stroke="#2A3550"/><text class="num" x="870" y="140" text-anchor="middle">9</text><text class="h" x="870" y="176" text-anchor="middle">Longest Streak</text><text class="small" x="870" y="207" text-anchor="middle">Jun 12 to Jun 20</text>
  <text class="small" x="28" y="280">The contribution snake below provides the visual GitHub activity map.</text>
</svg>