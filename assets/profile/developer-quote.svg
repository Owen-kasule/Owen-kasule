<svg xmlns="http://www.w3.org/2000/svg" width="900" height="175" viewBox="0 0 900 175" role="img" aria-label="Developer Quote"><style>.title{font:700 28px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#60A5FA}.h{font:700 24px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#F8FAFC}.small{font:500 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#A9B4C5}</style><rect x="1" y="1" width="898" height="173" rx="14" fill="#10162A" stroke="#1D4ED8" stroke-width="2"/><text class="title" x="28" y="46">Developer Quote</text><text class="h" x="450" y="103" text-anchor="middle">“The best way to predict the future is to invent it.”</text><text class="small" x="450" y="139" text-anchor="middle">Alan Kay</text></svg>